plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    alias(libs.plugins.spring.boot)
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation platform(libs.spring.boot.bom)
    // Spring AI's BOM aligns versions across all Spring AI modules.
    implementation platform(libs.spring.ai.bom)

    implementation 'org.springframework.boot:spring-boot-starter'
    // Wires up Azure OpenAI as the LLM backend; configure credentials in application.properties.
    implementation 'org.springframework.ai:spring-ai-starter-model-azure-openai'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.agentpatterns.App'
}

// Forward the terminal's stdin so the app can read interactive input, and run
// from the repo root so relative paths like "file.txt" resolve consistently.
tasks.named('run') {
    standardInput = System.in
    workingDir = rootProject.projectDir
}

tasks.named('bootRun') {
    standardInput = System.in
    workingDir = rootProject.projectDir
}
