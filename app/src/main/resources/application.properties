spring.application.name=agent-patterns

spring.ai.model.chat=azure-openai

# Azure OpenAI credentials come from the gitignored .env file (see .env.example).
# Set them via the SPRING_AI_AZURE_OPENAI_* environment variables, which bind
# directly to the properties below - never hardcode secrets here.
# The endpoint default is just a syntactically valid placeholder so the client
# bean can still be created at startup before real credentials are supplied.
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://replace-me.openai.azure.com/}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o}
