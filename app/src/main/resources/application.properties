spring.application.name=agent-patterns

# Disabled until Azure Foundry credentials are configured below.
# Set this to "azure-openai" once the properties below point at a real deployment.
spring.ai.model.chat=none

# Azure OpenAI configuration (to be filled in once Azure Foundry access is set up).
# Prefer environment variables over hardcoding secrets here.
# The endpoint placeholder below just needs to be a syntactically valid URL so the
# client bean can be created at startup even before real credentials are supplied.
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:https://replace-me.openai.azure.com/}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o}
